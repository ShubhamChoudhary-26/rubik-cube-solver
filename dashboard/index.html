<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rubik's Cube Solver</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Rubik's Cube Solver</h1>

    <!-- Cube -->
    <div class="cube">

        <!-- UP -->
        <div class="face up">

            <div class="cell white">W</div>
            <div class="cell white">W</div>
            <div class="cell white">W</div>

            <div class="cell white">W</div>
            <div class="cell white">W</div>
            <div class="cell white">W</div>

            <div class="cell white">W</div>
            <div class="cell white">W</div>
            <div class="cell white">W</div>

        </div>


        <!-- MIDDLE -->
        <div class="middle">

            <!-- LEFT -->
            <div class="face">

                <div class="cell green">G</div>
                <div class="cell green">G</div>
                <div class="cell green">G</div>

                <div class="cell green">G</div>
                <div class="cell green">G</div>
                <div class="cell green">G</div>

                <div class="cell green">G</div>
                <div class="cell green">G</div>
                <div class="cell green">G</div>

            </div>


            <!-- FRONT -->
            <div class="face">

                <div class="cell red">R</div>
                <div class="cell red">R</div>
                <div class="cell red">R</div>

                <div class="cell red">R</div>
                <div class="cell red">R</div>
                <div class="cell red">R</div>

                <div class="cell red">R</div>
                <div class="cell red">R</div>
                <div class="cell red">R</div>

            </div>


            <!-- RIGHT -->
            <div class="face">

                <div class="cell blue">B</div>
                <div class="cell blue">B</div>
                <div class="cell blue">B</div>

                <div class="cell blue">B</div>
                <div class="cell blue">B</div>
                <div class="cell blue">B</div>

                <div class="cell blue">B</div>
                <div class="cell blue">B</div>
                <div class="cell blue">B</div>

            </div>


            <!-- BACK -->
            <div class="face">

                <div class="cell orange">O</div>
                <div class="cell orange">O</div>
                <div class="cell orange">O</div>

                <div class="cell orange">O</div>
                <div class="cell orange">O</div>
                <div class="cell orange">O</div>

                <div class="cell orange">O</div>
                <div class="cell orange">O</div>
                <div class="cell orange">O</div>

            </div>

        </div>


        <!-- DOWN -->
        <div class="face down">

            <div class="cell yellow">Y</div>
            <div class="cell yellow">Y</div>
            <div class="cell yellow">Y</div>

            <div class="cell yellow">Y</div>
            <div class="cell yellow">Y</div>
            <div class="cell yellow">Y</div>

            <div class="cell yellow">Y</div>
            <div class="cell yellow">Y</div>
            <div class="cell yellow">Y</div>

        </div>

    </div>


    <!-- Solver Information -->
    <div class="info">

        <h2>Scramble</h2>

        <div class="value-box">
            <p id="scramble">Loading...</p>
        </div>


        <h2>Solution</h2>

        <div class="value-box">
            <p id="solution">Loading...</p>
        </div>


        <div class="stats">

            <div class="stat">
                <span class="label">Moves</span>
                <span id="moves" class="value">-</span>
            </div>


            <div class="stat">
                <span class="label">Algorithm</span>
                <span id="algorithm" class="value">-</span>
            </div>


            <div class="stat">
                <span class="label">Heuristic</span>
                <span id="heuristic" class="value">-</span>
            </div>

        </div>

    </div>


    <!-- Shuffle Depth Input -->
    <div class="input-section">

        <label for="shuffleDepth">
            Shuffle Depth
        </label>

        <input
            type="number"
            id="shuffleDepth"
            min="1"
            max="20"
            value="5"
        >

        <button onclick="solveCube()" class="solve-button">
            Solve Cube
        </button>

    </div>


    <!-- Reset -->
    <button onclick="resetCube()" class="reset-button">
        Reset
    </button>

</div>


<script src="script.js"></script>

</body>

</html>
